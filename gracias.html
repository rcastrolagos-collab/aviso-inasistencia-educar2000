<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviso enviado · Colegio Educar 2000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1E3A5C;
    --navy-dark: #142A44;
    --gold: #931A23;
    --gold-light: #CE979C;
    --paper: #F7F4EE;
    --ink: #22252B;
    --ink-soft: #565B63;
    --line: #D8D2C4;
    --ok: #3E6B4F;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
  }

  h1, h2{
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    color: var(--navy-dark);
    margin: 0;
  }

  header.band{
    background: var(--navy);
    color: #fff;
    padding: 34px 24px 30px;
  }

  header.band .wrap{
    max-width: 640px;
    margin: 0 auto;
  }

  .eyebrow{
    color: var(--gold-light);
    font-size: 13px;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  header.band h1{
    color: #fff;
    font-size: 28px;
    line-height: 1.2;
  }

  .success-screen{
    max-width: 640px;
    margin: 0 auto;
    padding: 60px 24px 80px;
    text-align: center;
  }

  .success-screen .check{
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--ok);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  .success-screen h2{
    font-size: 22px;
    margin-bottom: 10px;
  }

  .success-screen p{
    color: var(--ink-soft);
    font-size: 14.5px;
    max-width: 44ch;
    margin: 0 auto 26px;
  }

  .folio-final{
    display: inline-block;
    background: #fff;
    border: 1px solid var(--gold);
    border-top: 2px dashed var(--gold-light);
    border-radius: 3px;
    padding: 18px 26px 16px;
    margin-bottom: 30px;
  }

  .folio-final .label{
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .folio-final .value{
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--navy-dark);
  }

  .folio-final .value.sin-folio{
    font-size: 15px;
    color: var(--ink-soft);
    font-weight: 500;
    font-family: inherit;
  }

  a.volver{
    display: inline-block;
    color: var(--navy);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }

  a.volver:hover{ border-color: var(--navy); }
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div class="eyebrow">Colegio Educar 2000 · Inspección</div>
    <h1>Aviso de inasistencia</h1>
  </div>
</header>

<div class="success-screen">
  <div class="check">✓</div>
  <h2>Aviso enviado correctamente</h2>
  <p>El inspector recibió el aviso de inasistencia junto con el PDF generado y el certificado de respaldo (si lo adjuntó).</p>
  <div class="folio-final">
    <div class="label">Folio</div>
    <div class="value" id="folio-final-value">—</div>
  </div>
  <div>
    <a class="volver" href="aviso-inasistencia.html">← Registrar otro aviso</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const folio = params.get('folio');
  const valueEl = document.getElementById('folio-final-value');
  if (folio){
    valueEl.textContent = folio;
  } else {
    valueEl.textContent = 'No disponible';
    valueEl.classList.add('sin-folio');
  }
</script>

</body>
</html>
